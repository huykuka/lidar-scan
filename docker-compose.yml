services:
  lidar-studio-core:
    image: 010497/lidar-studio-core:latest
    platform: linux/amd64
    container_name: lidar-studio-core
    restart: unless-stopped
    network_mode: "host"
    shm_size: "2gb"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=${PORT:-8004}
    # GPU access — requires nvidia-container-toolkit on the host.
    # Docker Compose silently ignores this block when no GPU is present,
    # so the file works on CPU-only machines too.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    volumes:
      - app_data:/app/data
      - app_plugins:/app/app/plugins/installed

  lidar-studio-ui:
    image: 010497/lidar-studio-ui:latest
    platform: linux/amd64
    container_name: lidar-studio-ui
    restart: unless-stopped
    environment:
      - BACKEND_PORT=${PORT:-8004}
    ports:
      - "8005:80"
    depends_on:
      - lidar-studio-core
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  app_data:
    driver: local
  app_plugins:
    driver: local
