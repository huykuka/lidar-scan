<div
  class="flex items-center justify-between gap-3 p-3 bg-syn-color-neutral-50 rounded-lg border sticky top-0 z-10"
  [class.mb-2]="description()"
  [class.mb-4]="!description()"
>
  <div class="flex items-center gap-3 min-w-0 flex-1">
    <div
      class="w-8 h-8 bg-syn-page-background-color rounded-lg shadow-sm border flex items-center justify-center shrink-0"
      [ngClass]="iconColor()"
    >
      <syn-icon [attr.name]="icon()" class="text-lg" />
    </div>
    <div class="flex items-center gap-2 min-w-0">
      <h2 class="text-xs font-bold text-syn-color-neutral-900 truncate">{{ title() }}</h2>
      <ng-content select="syn-badge" />
    </div>
  </div>

  <div class="flex gap-2 shrink-0 items-center">
    <syn-dropdown placement="bottom-end" [distance]="8">
      <syn-icon-button slot="trigger" name="more_vert" label="Node config actions" size="small" />
      <syn-menu>
        <syn-menu-item (click)="exportConfig()">
          <syn-icon name="download" slot="prefix" />
          Export config
        </syn-menu-item>
        <syn-menu-item (click)="importInput.click()">
          <syn-icon name="upload" slot="prefix" />
          Import config
        </syn-menu-item>
      </syn-menu>
    </syn-dropdown>
    <input
      #importInput
      type="file"
      accept="application/json,.json"
      class="hidden"
      data-testid="node-import-input"
      (change)="onImportFileSelected($event)"
    />
    <syn-button (click)="cancel.emit()" size="small" variant="outline">
      <syn-icon name="close" />
      Cancel
    </syn-button>
    <syn-button (click)="save.emit()" [disabled]="saveDisabled()" size="small" variant="filled">
      <syn-icon name="save" />
      Save
    </syn-button>
  </div>
</div>

@if (description()) {
  <p class="text-[11px] text-syn-color-neutral-800 mb-4 px-1">{{ description() }}</p>
}
