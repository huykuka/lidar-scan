<app-node-editor-header
  icon="dashboard"
  iconColor="text-syn-color-primary-500"
  title="Output Node"
  description="Broadcasts metadata downstream. Configure webhook and TCP stream below."
  [saveDisabled]="!form.valid || isSaving()"
  (save)="onSave()"
  (cancel)="onCancel()"
/>

<form [formGroup]="form" class="flex flex-col gap-4">

  <!-- Node Name -->
  <syn-validate on="live">
    <syn-input
      label="Node Name"
      formControlName="name"
      size="small"
      placeholder="Output"
      required
    />
  </syn-validate>


  <!-- ── TCP Stream section ────────────────────────────────────────── -->
  <div class="flex flex-col gap-3 p-3 rounded-md border border-syn-color-neutral-200">
    <!-- Header row with toggle -->
    <div class="flex items-center justify-between">
      <div>
        <span class="text-sm font-semibold text-syn-color-neutral-800">TCP Stream</span>
        <p class="text-xs text-syn-color-neutral-500 mt-0.5">
          Expose a raw TCP server. Clients receive NDJSON frames on each update.
        </p>
      </div>
      <syn-switch formControlName="tcp_enabled" size="small">
        {{ form.get('tcp_enabled')?.value ? 'Enabled' : 'Disabled' }}
      </syn-switch>
    </div>

    @if (form.get('tcp_enabled')?.value) {
      <syn-validate on="live">
        <syn-input
          label="Port"
          formControlName="tcp_port"
          size="small"
          type="number"
          [attr.min]="1"
          [attr.max]="65535"
          placeholder="9000"
          required
        >
          <div slot="help-text">
            <p class="text-xs text-syn-color-neutral-500">
              The TCP port to listen on. Must be open and not in use by another process.
            </p>
          </div>
        </syn-input>
      </syn-validate>
    }
  </div>

</form>
