<svg [attr.viewBox]="'0 0 ' + width + ' ' + height" class="w-full h-auto" role="img"
     [attr.aria-label]="'Sweep: ' + yLabel() + ' against ' + xLabel()">
  @let c = chart();

  <!-- Tolerance band + expected value -->
  @if (c.bandTop !== null && c.bandBottom !== null) {
    <rect class="band" [attr.x]="c.plot.left" [attr.y]="c.bandTop" [attr.width]="c.plot.right - c.plot.left"
          [attr.height]="c.bandBottom - c.bandTop" />
  }

  <!-- Grid + y axis -->
  @for (t of c.yTicks; track t.value) {
    <line class="grid" [attr.x1]="c.plot.left" [attr.x2]="c.plot.right" [attr.y1]="t.y" [attr.y2]="t.y" />
    <text class="tick" [attr.x]="c.plot.left - 8" [attr.y]="t.y + 4" text-anchor="end">{{ t.value }}</text>
  }

  @if (c.expectedY !== null) {
    <line class="expected" [attr.x1]="c.plot.left" [attr.x2]="c.plot.right" [attr.y1]="c.expectedY" [attr.y2]="c.expectedY" />
    <text class="expected-label" [attr.x]="c.plot.right" [attr.y]="c.expectedY - 5" text-anchor="end">ground truth</text>
  }

  <!-- x axis -->
  <line class="axis" [attr.x1]="c.plot.left" [attr.x2]="c.plot.right" [attr.y1]="c.plot.bottom" [attr.y2]="c.plot.bottom" />
  @for (t of c.xTicks; track $index) {
    <text class="tick" [attr.x]="t.x" [attr.y]="c.plot.bottom + 18" text-anchor="middle">{{ t.label }}</text>
  }

  <!-- Series -->
  @if (c.line) {
    <path class="series" [attr.d]="c.line" fill="none" />
  }
  @for (p of c.plotted; track p.runId) {
    @if (p.errTop !== null && p.errBottom !== null && p.cy !== null) {
      <line class="err" [attr.x1]="p.cx" [attr.x2]="p.cx" [attr.y1]="p.errTop" [attr.y2]="p.errBottom" />
    }
    @if (p.cy !== null) {
      <circle
        (click)="pointClick.emit(p.runId)"
        [attr.cx]="p.cx"
        [attr.cy]="p.cy"
        [class.best]="p.runId === bestRunId()"
        [class.selected]="p.runId === selectedRunId()"
        class="dot"
        r="6"
      >
        <title>{{ tooltip(p.label, p.value) }}</title>
      </circle>
    } @else {
      <!-- No value for this run (failed or metric missing) -->
      <text class="missing" [attr.x]="p.cx" [attr.y]="c.plot.bottom - 6" text-anchor="middle">×</text>
    }
  }

  @if (xLabel()) {
    <text class="axis-label" [attr.x]="(c.plot.left + c.plot.right) / 2" [attr.y]="height - 4" text-anchor="middle">{{ xLabel() }}</text>
  }
</svg>
